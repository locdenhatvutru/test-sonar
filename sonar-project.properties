# ========================
# Project identification
# ========================
sonar.projectKey=test-sonarqube-php
sonar.organization=pokemon13
sonar.projectName=Test SonarQube PHP
sonar.projectVersion=1.0

# ========================
# Source settings
# ========================
sonar.sources=src

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# ========================
# Language-specific (auto detect usually)
# ========================
# sonar.language=php

# ========================
# Exclusions
# ========================
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**

# ========================
# Test & coverage
# ========================
sonar.php.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ========================
# Server config
# ========================
# Note: sonar.host.url and sonar.login (token) should be configured via:
# - Environment variables (for CI/CD)
# - GitHub Actions Secrets: SONAR_HOST_URL and SONAR_TOKEN
# - Command line: -Dsonar.host.url=<url> -Dsonar.login=<token>
#
# For local development, uncomment and set these:
# sonar.host.url=http://localhost:9000
# sonar.login=your_token_here